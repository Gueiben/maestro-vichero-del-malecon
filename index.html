function vSub(a, b) {
  return [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
}
function vCross(a, b) {
  return [
    a[1] * b[2] - a[2] * b[1],
    a[2] * b[0] - a[0] * b[2],
    a[0] * b[1] - a[1] * b[0]
  ];
}
function vNorm(a) {
  const l = Math.hypot(a[0], a[1], a[2]) || 1;
  return [a[0] / l, a[1] / l, a[2] / l];
}

function makeTriUV(v0, v1, v2, rgb, emit, tex, uv0, uv1, uv2) {
  const e1 = vSub(v1, v0);
  const e2 = vSub(v2, v0);
  const n = vNorm(vCross(e1, e2));
  return {
    v0: v0,
    v1: v1,
    v2: v2,
    n: n,
    rgb: rgb,
    emit: emit || 0,
    tex: tex || "adoquin",
    uv0: uv0 || [0, 0],
    uv1: uv1 || [0, 1],
    uv2: uv2 || [1, 1]
  };
}

function makeTri(v0, v1, v2, rgb, emit, tex) {
  return makeTriUV(v0, v1, v2, rgb, emit, tex || "adoquin", [0, 0], [0, 1], [1, 1]);
}

function addQuadUV(tris, a, b, c, d, rgb, emit, tex, u0, v0, u1, v1) {
  const uu0 = u0 !== undefined ? u0 : 0.0;
  const vv0 = v0 !== undefined ? v0 : 0.0;
  const uu1 = u1 !== undefined ? u1 : 1.0;
  const vv1 = v1 !== undefined ? v1 : 1.0;
  const tx = tex || "adoquin";
  tris.push(makeTriUV(a, b, c, rgb, emit, tx, [uu0, vv1], [uu0, vv0], [uu1, vv0]));
  tris.push(makeTriUV(a, c, d, rgb, emit, tx, [uu0, vv1], [uu1, vv0], [uu1, vv1]));
}

function addQuad(tris, a, b, c, d, rgb, emit, tex) {
  addQuadUV(tris, a, b, c, d, rgb, emit, tex || "adoquin", 0, 0, 1, 1);
}

function addSubdividedQuadUV(tris, a, b, c, d, segsU, segsV, colA, colB, emit, tex) {
  for (let u = 0; u < segsU; u++) {
    const u0 = u / segsU;
    const u1 = (u + 1) / segsU;
    for (let v = 0; v < segsV; v++) {
      const v0 = v / segsV;
      const v1 = (v + 1) / segsV;
      const bilerp = (uu, vv) => [
        (1 - uu) * (1 - vv) * a[0] + uu * (1 - vv) * d[0] + uu * vv * c[0] + (1 - uu) * vv * b[0],
        (1 - uu) * (1 - vv) * a[1] + uu * (1 - vv) * d[1] + uu * vv * c[1] + (1 - uu) * vv * b[1],
        (1 - uu) * (1 - vv) * a[2] + uu * (1 - vv) * d[2] + uu * vv * c[2] + (1 - uu) * vv * b[2]
      ];
      const p00 = bilerp(u0, v0);
      const p01 = bilerp(u0, v1);
      const p11 = bilerp(u1, v1);
      const p10 = bilerp(u1, v0);
      const col = ((u + v) & 1) === 0 ? colA : colB;
      addQuadUV(tris, p00, p01, p11, p10, col, emit, tex || "catedral", u0, 1 - v1, u1, 1 - v0);
    }
  }
}

function addBox(tris, cx, cy, cz, sx, sy, sz, rgb, emit, tex) {
  const tx = tex || "madera";
  const x0 = cx - sx * 0.5, x1 = cx + sx * 0.5;
  const y0 = cy - sy * 0.5, y1 = cy + sy * 0.5;
  const z0 = cz - sz * 0.5, z1 = cz + sz * 0.5;
  const p000 = [x0, y0, z0], p100 = [x1, y0, z0], p110 = [x1, y1, z0], p010 = [x0, y1, z0];
  const p001 = [x0, y0, z1], p101 = [x1, y0, z1], p111 = [x1, y1, z1], p011 = [x0, y1, z1];
  const dark = [Math.max(0, rgb[0] - 14), Math.max(0, rgb[1] - 14), Math.max(0, rgb[2] - 14)];
  const topCol = [Math.min(255, rgb[0] + 14), Math.min(255, rgb[1] + 14), Math.min(255, rgb[2] + 14)];
  addQuadUV(tris, p000, p010, p110, p100, rgb, emit, tx, 0, 0, 1, 1);
  addQuadUV(tris, p101, p111, p011, p001, rgb, emit, tx, 0, 0, 1, 1);
  addQuadUV(tris, p001, p011, p010, p000, dark, emit, tx, 0, 0, 1, 1);
  addQuadUV(tris, p100, p110, p111, p101, dark, emit, tx, 0, 0, 1, 1);
  addQuadUV(tris, p010, p011, p111, p110, topCol, emit, tx, 0, 0, 1, 1);
}

function addRotBox(tris, cx, cy, cz, sx, sy, sz, yaw, rgb, emit, tex) {
  const tx = tex || "madera";
  const c = Math.cos(yaw), s = Math.sin(yaw);
  const rot = (lx, ly, lz) => [cx + lx * c + lz * s, cy + ly, cz - lx * s + lz * c];
  const hx = sx * 0.5, hy = sy * 0.5, hz = sz * 0.5;
  const p000 = rot(-hx, -hy, -hz), p100 = rot(hx, -hy, -hz), p110 = rot(hx, hy, -hz), p010 = rot(-hx, hy, -hz);
  const p001 = rot(-hx, -hy, hz), p101 = rot(hx, -hy, hz), p111 = rot(hx, hy, hz), p011 = rot(-hx, hy, hz);
  const dark = [Math.max(0, rgb[0] - 14), Math.max(0, rgb[1] - 14), Math.max(0, rgb[2] - 14)];
  const topCol = [Math.min(255, rgb[0] + 14), Math.min(255, rgb[1] + 14), Math.min(255, rgb[2] + 14)];
  addQuadUV(tris, p000, p010, p110, p100, rgb, emit, tx, 0, 0, 1, 1);
  addQuadUV(tris, p101, p111, p011, p001, rgb, emit, tx, 0, 0, 1, 1);
  addQuadUV(tris, p001, p011, p010, p000, dark, emit, tx, 0, 0, 1, 1);
  addQuadUV(tris, p100, p110, p111, p101, dark, emit, tx, 0, 0, 1, 1);
  addQuadUV(tris, p010, p011, p111, p110, topCol, emit, tx, 0, 0, 1, 1);
}

function addPyramid(tris, cx, yBase, cz, sx, sy, sz, rgb, emit, tex) {
  const tx = tex || "adoquin";
  const x0 = cx - sx * 0.5, x1 = cx + sx * 0.5;
  const z0 = cz - sz * 0.5, z1 = cz + sz * 0.5;
  const top = [cx, yBase + sy, cz];
  const p00 = [x0, yBase, z0], p10 = [x1, yBase, z0], p11 = [x1, yBase, z1], p01 = [x0, yBase, z1];
  tris.push(makeTriUV(p00, top, p10, rgb, emit, tx, [0, 1], [0.5, 0], [1, 1]));
  tris.push(makeTriUV(p10, top, p11, rgb, emit, tx, [0, 1], [0.5, 0], [1, 1]));
  tris.push(makeTriUV(p11, top, p01, rgb, emit, tx, [0, 1], [0.5, 0], [1, 1]));
  tris.push(makeTriUV(p01, top, p00, rgb, emit, tx, [0, 1], [0.5, 0], [1, 1]));
}

function addCylinder(tris, cx, y0, cz, rBot, rTop, h, segs, rgb, emit, tex) {
  const tx = tex || "madera";
  const y1 = y0 + h;
  const sCount = Math.max(10, segs);
  const dark = [Math.max(0, rgb[0] - 12), Math.max(0, rgb[1] - 12), Math.max(0, rgb[2] - 12)];
  for (let i = 0; i < sCount; i++) {
    const u0 = i / sCount;
    const u1 = (i + 1) / sCount;
    const a0 = u0 * Math.PI * 2;
    const a1 = u1 * Math.PI * 2;
    const b0 = [cx + Math.cos(a0) * rBot, y0, cz + Math.sin(a0) * rBot];
    const b1 = [cx + Math.cos(a1) * rBot, y0, cz + Math.sin(a1) * rBot];
    const t0 = [cx + Math.cos(a0) * rTop, y1, cz + Math.sin(a0) * rTop];
    const t1 = [cx + Math.cos(a1) * rTop, y1, cz + Math.sin(a1) * rTop];
    const c = (i & 1) === 0 ? rgb : dark;
    addQuadUV(tris, b0, t0, t1, b1, c, emit, tx, u0, 0, u1, 1);
    tris.push(makeTriUV([cx, y1, cz], t1, t0, rgb, emit, tx, [0.5, 0.5], [u1, 0], [u0, 0]));
  }
}

// Superficie de revolucion (lathe) organica de alta definicion con coordenadas UV completas
function addLatheSculpted(tris, cx, cy, cz, profileYR, segs, scaleX, scaleY, scaleZ, yaw, rgb, emit, tex, vMin, vMax) {
  const tx = tex || "chontaduro";
  const vvMin = vMin !== undefined ? vMin : 0.0;
  const vvMax = vMax !== undefined ? vMax : 1.0;
  const altCol = [Math.max(0, rgb[0] - 10), Math.max(0, rgb[1] - 10), Math.max(0, rgb[2] - 10)];
  const numR = profileYR.length;
  for (let r = 0; r < numR - 1; r++) {
    const p0 = profileYR[r];
    const p1 = profileYR[r + 1];
    const v0 = vvMin + (1.0 - r / Math.max(1, numR - 1)) * (vvMax - vvMin);
    const v1 = vvMin + (1.0 - (r + 1) / Math.max(1, numR - 1)) * (vvMax - vvMin);
    for (let s = 0; s < segs; s++) {
      const u0 = s / segs;
      const u1 = (s + 1) / segs;
      const a0 = yaw + u0 * Math.PI * 2;
      const a1 = yaw + u1 * Math.PI * 2;
      const q00 = [cx + Math.cos(a0) * p0[1] * scaleX, cy + p0[0] * scaleY, cz + Math.sin(a0) * p0[1] * scaleZ];
      const q10 = [cx + Math.cos(a1) * p0[1] * scaleX, cy + p0[0] * scaleY, cz + Math.sin(a1) * p0[1] * scaleZ];
      const q11 = [cx + Math.cos(a1) * p1[1] * scaleX, cy + p1[0] * scaleY, cz + Math.sin(a1) * p1[1] * scaleZ];
      const q01 = [cx + Math.cos(a0) * p1[1] * scaleX, cy + p1[0] * scaleY, cz + Math.sin(a0) * p1[1] * scaleZ];
      const col = ((r + s) & 1) === 0 ? rgb : altCol;
      addQuadUV(tris, q00, q01, q11, q10, col, emit, tx, u0, v1, u1, v0);
    }
  }
}

function addSphereLowPoly(tris, cx, cy, cz, rx, ry, rz, yaw, rgb, emit, tex, vMin, vMax) {
  const profile = [
    [-1.00, 0.04],
    [-0.82, 0.48],
    [-0.48, 0.84],
    [-0.12, 0.98],
    [0.20, 0.96],
    [0.54, 0.80],
    [0.84, 0.46],
    [1.00, 0.04]
  ];
  addLatheSculpted(tris, cx, cy, cz, profile, 12, rx, ry, rz, yaw, rgb, emit, tex || "borojo", vMin, vMax);

// Palmera de Chontaduro Curva con Hojas Doradas/Bronce del Atardecer (CERO verde chillon)
function addCrashPalmTree(tris, px, py, pz, scale, leanX, leanZ) {
  const segs = 7;
  let curX = px, curY = py, curZ = pz;
  for (let s = 0; s < segs; s++) {
    const t = s / segs;
    const h = 1.05 * scale;
    const nx = curX + leanX * (t + 0.15) * 0.32;
    const nz = curZ + leanZ * (t + 0.15) * 0.32;
    const r0 = (0.44 - t * 0.22) * scale;
    const r1 = (0.40 - (t + 1 / segs) * 0.22) * scale;
    const barkCol = (s & 1) === 0 ? [154, 96, 52] : [128, 78, 42];
    addCylinder(tris, (curX + nx) * 0.5, curY, (curZ + nz) * 0.5, r0, r1, h, 10, barkCol, 0.05, "palma_tronco");
    curX = nx;
    curY += h;
    curZ = nz;
  }
  // Racimos de Chontaduro Esculpidos bajo la copa
  addSculptedChontaduro3D(tris, curX + 0.38 * scale, curY - 0.25 * scale, curZ, 0.72 * scale, 0, false);
  addSculptedChontaduro3D(tris, curX - 0.35 * scale, curY - 0.25 * scale, curZ + 0.28 * scale, 0.72 * scale, 1.2, true);

  // 8 Pencas Curvas con paleta Calida Dorada/Ocre/Bronce de Atardecer (CERO verde dominante!)
  const numFronds = 8;
  for (let f = 0; f < numFronds; f++) {
    const ang = (f / numFronds) * Math.PI * 2;
    const ca = Math.cos(ang), sa = Math.sin(ang);
    const pxn = -sa * 0.52 * scale, pzn = ca * 0.52 * scale;
    const p0 = [curX, curY + 0.2 * scale, curZ];
    const p1 = [curX + ca * 1.5 * scale, curY + 0.62 * scale, curZ + sa * 1.5 * scale];
    const p2 = [curX + ca * 2.9 * scale, curY + 0.12 * scale, curZ + sa * 2.9 * scale];
    const p3 = [curX + ca * 4.0 * scale, curY - 0.75 * scale, curZ + sa * 4.0 * scale];
    const leafWarm = (f & 1) === 0 ? [184, 146, 56] : [162, 124, 48];
    const leafShade = [138, 102, 42];
    tris.push(makeTriUV(p0, [p1[0] + pxn, p1[1], p1[2] + pzn], p2, leafWarm, 0.08, "popocho", [0.5, 0], [0, 0.5], [0.5, 0.8]));
    tris.push(makeTriUV(p0, p2, [p1[0] - pxn, p1[1], p1[2] - pzn], leafShade, 0.05, "popocho", [0.5, 0], [0.5, 0.8], [1, 0.5]));
    tris.push(makeTriUV([p1[0] + pxn, p1[1], p1[2] + pzn], [p2[0] + pxn * 0.7, p2[1], p2[2] + pzn * 0.7], p3, leafWarm, 0.08, "popocho", [0, 0.5], [0, 0.85], [0.5, 1]));
    tris.push(makeTriUV([p1[0] - pxn, p1[1], p1[2] - pzn], p3, [p2[0] - pxn * 0.7, p2[1], p2[2] - pzn * 0.7], leafShade, 0.05, "popocho", [1, 0.5], [0.5, 1], [1, 0.85]));
  }
}

  const c = Math.cos(yaw), s = Math.sin(yaw);

    x + (lx * c + lz * s) * scale,
    y + ly * scale - crouch,
    z + (-lx * s + lz * c) * scale

  const legSw = Math.sin(walkPhase) * 0.34;
  const armSw = Math.cos(walkPhase) * 0.36;

  // Tenis esculpidos
  const lShoe = toWorld(-0.22, 0.14 + Math.max(0, legSw * 0.25), legSw * 0.85);
  const rShoe = toWorld(0.22, 0.14 + Math.max(0, -legSw * 0.25), -legSw * 0.85);

  const legProfile = [

  const lLeg = toWorld(-0.22, 0.18, legSw * 0.45);

  addLatheSculpted(tris, lLeg[0], lLeg[1], lLeg[2], legProfile, 10, scale, scale, scale, yaw, pantsRgb, 0.05, "personaje", 0.72, 0.90);
  addLatheSculpted(tris, rLeg[0], rLeg[1], rLeg[2], legProfile, 10, scale, scale, scale, yaw, pantsRgb, 0.05, "personaje", 0.72, 0.90);

  // Torso anatomico esculpido (cintura, pecho, hombros redondeados)

    [1.70, 0.16]

  addLatheSculpted(tris, hip[0], hip[1], hip[2], torsoProfile, 12, scale, scale, scale, yaw, shirtRgb, 0.14, "personaje", 0.38, 0.72);

  // Brazos torneados con hombros y manos esfericas
  const armProfile = [
    [-0.42, 0.09],
    [-0.22, 0.10],
    [0.00, 0.12],
    [0.16, 0.14]
  ];
  const lArm = toWorld(-0.52, 1.42, -armSw * 0.45);

  addLatheSculpted(tris, lArm[0], lArm[1], lArm[2], armProfile, 10, scale, scale, scale, yaw, skinRgb, 0.08, "personaje", 0.05, 0.35);
  addLatheSculpted(tris, rArm[0], rArm[1], rArm[2], armProfile, 10, scale, scale, scale, yaw, skinRgb, 0.08, "personaje", 0.05, 0.35);

  if (weaponSwing >= 0) {
    const wp = toWorld(0.72, 1.38 + Math.sin(weaponSwing * Math.PI) * 0.55, 0.62);
    addCylinder(tris, wp[0], wp[1] - 0.45 * scale, wp[2], 0.06 * scale, 0.07 * scale, 0.72 * scale, 10, [138, 84, 42], 0.04, "madera");

  }

  // Cabeza esculpida con rostro mapeado en la parte superior del atlas + sombrero chocoano torneado
  const head = toWorld(0, 1.96, 0);
  addSphereLowPoly(tris, head[0], head[1], head[2], 0.33 * scale, 0.37 * scale, 0.33 * scale, yaw, skinRgb, 0.12, "personaje", 0.02, 0.36);

function drawTexturedTriangleAffine(ctx, img, x0, y0, x1, y1, x2, y2, u0, v0, u1, v1, u2, v2, shadeRgba) {
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(x0, y0);
  ctx.lineTo(x1, y1);
  ctx.lineTo(x2, y2);
  ctx.closePath();
  ctx.clip();

  const tw = img.naturalWidth || 64;
  const th = img.naturalHeight || 64;
  const su0 = u0 * tw, sv0 = v0 * th;
  const su1 = u1 * tw, sv1 = v1 * th;
  const su2 = u2 * tw, sv2 = v2 * th;

  const det = (su1 - su0) * (sv2 - sv0) - (su2 - su0) * (sv1 - sv0);
  if (Math.abs(det) > 1e-4) {
    const idet = 1.0 / det;
    const a = ((x1 - x0) * (sv2 - sv0) - (x2 - x0) * (sv1 - sv0)) * idet;
    const b = ((y1 - y0) * (sv2 - sv0) - (y2 - y0) * (sv1 - sv0)) * idet;
    const c = ((su1 - su0) * (x2 - x0) - (su2 - su0) * (x1 - x0)) * idet;
    const d = ((su1 - su0) * (y2 - y0) - (su2 - su0) * (y1 - y0)) * idet;
    const e = x0 - a * su0 - c * sv0;
    const f = y0 - b * su0 - d * sv0;
    ctx.transform(a, b, c, d, e, f);
    ctx.drawImage(img, 0, 0);
  }
  ctx.restore();

  if (shadeRgba) {
    ctx.beginPath();
    ctx.moveTo(x0, y0);
    ctx.lineTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.closePath();
    ctx.fillStyle = shadeRgba;
    ctx.fill();
  }
}

  return { staticTris: staticTris, billboards: billboards };
}

function createGame2Runtime(canvas, getViewportSize) {
  const texImages = {};
  Object.keys(PAINTED_TEXTURES_B64).forEach((k) => {
    const img = new Image();
    img.src = PAINTED_TEXTURES_B64[k];
    texImages[k] = img;
  });

  const worldData = buildVicheroOpenWorld();
  const staticWorldTris = worldData.staticTris;
  const staticBillboards = worldData.billboards;

  const keys = {};
  const drag = { active: false, lastX: 0, lastY: 0 };

  const player = {
    x: -0.25,
    y: 1.74,
    z: -1.25,
    vy: 0,
    yaw: 0.04,
    pitch: -0.03,
    onGround: true,
    bobPhase: 0.5,
    holding: {
      type: "bulto",
      label: "BULTO DE CHAMPA [ESPACIO/F ABRIR]",
      tex: "chontaduro",
      count: 1
    }
  };

  const sim = {
    money: 145,
    rep: 220,
    rawChonta: 6,
    rawBotanicos: 5,
    shelfChonta: 5,
    shelfBottles: 6,
    shelfLegend: 2,
    pailaState: "READY",
    pailaTimer: 0,
    alambiqueState: "READY",
    alambiqueTimer: 0,
    time: 0,
    packRevealTimer: 0,
    packItems: [],
    toast: "JANFRY Y JONYER ESPERAN EN EL MOSTRADOR! PULSA [E] PARA DESPACHAR O [F] PARA ABRIR BULTO 3D.",
    npcs: MEME_CUSTOMERS.map((c) => Object.assign({}, c, { state: "WALKING", timer: 0 }))
  };

  function playSfx(freq, slideFreq, dur, waveType) {
    if (typeof window === "undefined") return;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      const ac = new AC();
      const osc = ac.createOscillator();
      const gain = ac.createGain();
      osc.type = waveType;
      osc.frequency.setValueAtTime(freq, ac.currentTime);
      osc.frequency.exponentialRampToValueAtTime(slideFreq, ac.currentTime + dur);
      gain.gain.setValueAtTime(0.06, ac.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + dur);
      osc.connect(gain);
      gain.connect(ac.destination);
      osc.start();
      osc.stop(ac.currentTime + dur);
    } catch (e) {}
  }

  function trigger3DPackOpening() {
    sim.packRevealTimer = 4.2;
    sim.rawChonta += 4;
    sim.rawBotanicos += 3;
    sim.packItems = [
      { name: "CHONTADURO ROJO", tex: "chontaduro", rgb: [232, 68, 36], isLegend: false },
      { name: "BOROJO DEL BAJO ATRATO", tex: "borojo", rgb: [132, 204, 22], isLegend: false },
      { name: "AMARILLO LEGENDARIO ($60)", tex: "chontaduro", rgb: [252, 214, 38], isLegend: true },
      { name: "VICHE CURADO SAN PACHO", tex: "viche", rgb: [52, 211, 153], isLegend: false },
      { name: "POPOCHO ASADO", tex: "popocho", rgb: [250, 184, 34], isLegend: false }
    ];
    player.holding = {
      type: "legend_chonta",
      label: "CHONTADURO AMARILLO LEGENDARIO ($60)",
      tex: "chontaduro",
      count: 1
    };
    playSfx(440, 880, 0.28, "sawtooth");
    sim.toast = "BULTO DE CHAMPA ABIERTO! SALIO CHONTADURO AMARILLO LEGENDARIO ($60 COP)!";
  }

  function getHoveredTarget() {
    const lookX = Math.sin(player.yaw);
    const lookZ = Math.cos(player.yaw);
    let best = null;
    let bestDist = 5.2;

    sim.npcs.forEach((n, idx) => {
      const dx = n.x - player.x;
      const dz = n.z - player.z;
      const d = Math.hypot(dx, dz);
      if (d < bestDist) {
        const dot = (dx * lookX + dz * lookZ) / Math.max(0.001, d);
        if (dot > 0.58) {
          bestDist = d;
          best = {
            kind: "npc",
            idx: idx,
            npc: n,
            label: "[E] DESPACHAR A " + n.name.toUpperCase() + " - " + n.want
          };
        }
      }
    });

    const stations = [
      { id: "counter", x: 0.0, z: 2.65, r: 2.6, label: "[E] COBRAR Y ATENDER CLIENTE EN MOSTRADOR" },
      {
        id: "fogon", x: -2.6, z: 0.5, r: 2.5,
        label: sim.pailaState === "READY"
          ? "[E] RECOGER BANDEJA DE CHONTADUROS COCINADOS"
          : "[E] AVIVAR FOGON DE LENA Y PAILA DE COBRE"
      },
      {
        id: "alambique", x: -2.6, z: -1.35, r: 2.5,
        label: sim.alambiqueState === "READY"
          ? "[E] RECOGER 3 BOTELLAS DE VICHE Y ARRECHON"
          : "[E] DESTILAR VICHE EN ALAMBIQUE DE COBRE"
      },
      {
        id: "shelf", x: 2.6, z: 0.4, r: 2.6,
        label: player.holding
          ? "[E] SURTIR " + player.holding.label + " EN ESTANTERIA"
          : "[E] TOMAR BULTO DE COSECHA DE LA ESTANTERIA"
      },
      { id: "dock", x: 0.0, z: -12.5, r: 4.0, label: "[E] COMPRAR BULTO EN LA CHAMPA DEL ATRATO ($15)" }
    ];

    stations.forEach((st) => {
      const dx = st.x - player.x;
      const dz = st.z - player.z;
      const d = Math.hypot(dx, dz);
      if (d < st.r + 1.8) {
        const dot = (dx * lookX + dz * lookZ) / Math.max(0.001, d);
        if (dot > 0.55 && d < bestDist) {
          bestDist = d;
          best = { kind: "station", id: st.id, label: st.label };
        }
      }
    });
    return best;
  }

  function serveCustomer(idx) {
    const n = sim.npcs[idx] || sim.npcs[0];
    if (sim.shelfLegend > 0 || (player.holding && player.holding.type === "legend_chonta")) {
      if (player.holding && player.holding.type === "legend_chonta") player.holding = null;
      else sim.shelfLegend -= 1;
      sim.money += 60;
      sim.rep += 25;
      n.state = "CELEBRATING";
      n.timer = 4.0;
      playSfx(587, 1174, 0.25, "sawtooth");
      sim.toast = n.name.toUpperCase() + ': "' + n.quote + '" (+$60 COP)!';
    } else if (sim.shelfBottles > 0) {
      sim.shelfBottles -= 1;
      sim.money += 28;
      sim.rep += 14;
      n.state = "CELEBRATING";
      n.timer = 3.8;
      playSfx(523, 880, 0.22, "sawtooth");
      sim.toast = "VENDISTE BOTELLA DE ARRECHON A " + n.name.toUpperCase() + " (+$28 COP)!";
    } else if (sim.shelfChonta > 0) {
      sim.shelfChonta -= 1;
      sim.money += 18;
      sim.rep += 10;
      n.state = "CELEBRATING";
      n.timer = 3.5;
      playSfx(440, 660, 0.18, "triangle");
      sim.toast = "DESPACHASTE CHONTADURO CON MIEL Y SAL A " + n.name.toUpperCase() + " (+$18 COP)!";
    } else {
      sim.toast = "ESTANTE VACIO! RECOGE DE LA PAILA O DEL ALAMBIQUE DE COBRE.";
    }
  }

  function handleInteract() {
    if (player.holding && player.holding.type === "bulto") {
      trigger3DPackOpening();
      return;
    }
    const target = getHoveredTarget();
    if (!target) {
      serveCustomer(0);
      return;
    }
    if (target.kind === "npc") {
      serveCustomer(target.idx || 0);
      return;
    }
    if (target.id === "counter") {
      serveCustomer(0);
    } else if (target.id === "fogon") {
      if (sim.pailaState === "READY") {
        sim.pailaState = "COOKING";
        sim.pailaTimer = 4.0;
        player.holding = { type: "chonta_tray", label: "3 VASOS DE CHONTADURO MADURO", tex: "chontaduro", count: 3 };
        playSfx(520, 780, 0.16, "triangle");
        sim.toast = "LLEVAS 3 VASOS DE CHONTADURO EN TUS MANOS! SURTE EL ESTANTE.";
      } else {
        sim.pailaState = "READY";
        playSfx(320, 480, 0.14, "triangle");
        sim.toast = "PAILA DE COBRE LISTA CON CHONTADURO CALIENTE!";
      }
    } else if (target.id === "alambique") {
      if (sim.alambiqueState === "READY") {
        sim.alambiqueState = "BREWING";
        sim.alambiqueTimer = 4.5;
        player.holding = { type: "bottle_crate", label: "3 BOTELLAS DE VICHE Y ARRECHON", tex: "viche", count: 3 };
        playSfx(540, 820, 0.16, "triangle");
        sim.toast = "RECOGISITE 3 BOTELLAS DE VICHE CURADO! PONLAS EN EL ESTANTE.";
      } else {
        sim.alambiqueState = "READY";
        playSfx(350, 520, 0.14, "triangle");
        sim.toast = "ALAMBIQUE LISTO CON VICHE Y ARRECHON DEL PACIFICO!";
      }
    } else if (target.id === "shelf") {
      if (player.holding) {
        if (player.holding.type === "chonta_tray") sim.shelfChonta += 3;
        else if (player.holding.type === "bottle_crate") sim.shelfBottles += 3;
        else if (player.holding.type === "legend_chonta") sim.shelfLegend += 1;
        sim.toast = "SURTISTE " + player.holding.label + " EN LA ESTANTERIA!";
        player.holding = null;
        playSfx(600, 900, 0.15, "square");
      } else {
        player.holding = { type: "bulto", label: "BULTO DE CHAMPA [ESPACIO/F ABRIR]", tex: "chontaduro", count: 1 };
        sim.toast = "TOMASTE UN BULTO DE COSECHA! PULSA [ESPACIO] O [F] PARA ABRIRLO.";
      }
    } else if (target.id === "dock") {
      if (sim.money >= 15) sim.money -= 15;
      player.holding = { type: "bulto", label: "BULTO DE CHAMPA [ESPACIO/F ABRIR]", tex: "chontaduro", count: 1 };
      playSfx(360, 540, 0.15, "square");
      sim.toast = "COMPRASTE UN BULTO EN LA CHAMPA DEL RIO ATRATO!";
    }
  }

  const lightDir = vNorm([0.38, 0.85, -0.36]);

  function stepFrame(dt) {
    sim.time += dt;
    if (sim.packRevealTimer > 0) sim.packRevealTimer = Math.max(0, sim.packRevealTimer - dt);
    if (sim.pailaState === "COOKING") {
      sim.pailaTimer -= dt;
      if (sim.pailaTimer <= 0) sim.pailaState = "READY";
    }
    if (sim.alambiqueState === "BREWING") {
      sim.alambiqueTimer -= dt;
      if (sim.alambiqueTimer <= 0) sim.alambiqueState = "READY";
    }

    const spd = keys["ShiftLeft"] || keys["ShiftRight"] ? 7.8 : 5.2;
    let mf = 0, ms = 0;
    if (keys["KeyW"] || keys["ArrowUp"]) mf += 1;
    if (keys["KeyS"] || keys["ArrowDown"]) mf -= 1;
    if (keys["KeyA"]) ms -= 1;
    if (keys["KeyD"]) ms += 1;
    if (keys["ArrowLeft"] || keys["KeyQ"]) player.yaw -= 1.95 * dt;
    if (keys["ArrowRight"] || keys["KeyR"]) player.yaw += 1.95 * dt;

    const sinY = Math.sin(player.yaw);
    const cosY = Math.cos(player.yaw);
    if (mf !== 0 || ms !== 0) {
      player.x = Math.max(-24.0, Math.min(24.0, player.x + (sinY * mf + cosY * ms) * spd * dt));
      player.z = Math.max(-13.0, Math.min(18.0, player.z + (cosY * mf - sinY * ms) * spd * dt));
      player.bobPhase += dt * 10.5;
    }

    player.vy -= 16.0 * dt;
    player.y += player.vy * dt;
    let groundY = 1.74;
    if (player.z < -7.0) groundY = 1.74 - Math.min(0.95, (-7.0 - player.z) * 0.15);
    else if (player.z > 11.5) groundY = 1.74 + Math.min(0.95, (player.z - 11.5) * 0.22);
    if (player.y <= groundY) {
      player.y = groundY;
      player.vy = 0;
      player.onGround = true;
    }

    sim.npcs.forEach((n, idx) => {
      if (n.state === "CELEBRATING") {
        n.timer -= dt;
        n.x += Math.sin(sim.time * 8 + idx) * 2.4 * dt;
        n.z += 1.3 * dt;
        if (n.timer <= 0) {
          n.x = n.tx;
          n.z = n.tz + 3.2;
          n.state = "WALKING";
        }
      } else {
        const dx = n.tx - n.x;
        const dz = n.tz - n.z;
        const d = Math.hypot(dx, dz);
        if (d > 0.15) {
          n.x += (dx / d) * 2.2 * dt;
          n.z += (dz / d) * 2.2 * dt;
        }
      }
    });

    const vp = getViewportSize();
    const W = vp.w;
    const H = vp.h;
    if (canvas.width !== W || canvas.height !== H) {
      canvas.width = W;
      canvas.height = H;
    }
    const ctx = canvas.getContext("2d", { alpha: false });
    if (!ctx) return;

    const FOV = Math.min(W, H) * 0.84;
    const SNAP_GRID = 1;

    // 1. Golden Sunset Sky over the Rio Atrato & Quibdo Cathedral
    const skyGrad = ctx.createLinearGradient(0, 0, 0, H * 0.58);
    skyGrad.addColorStop(0.0, "#191233");
    skyGrad.addColorStop(0.35, "#631D56");
    skyGrad.addColorStop(0.70, "#D95D2B");
    skyGrad.addColorStop(1.0, "#F9B83C");
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0, 0, W, H);

    const dynTris = [];
    // Animated Rio Atrato Water South of Malecon (z = -22..-9)
    for (let wx = -24; wx < 24; wx += 4.0) {
      for (let wz = -22; wz < -9; wz += 4.0) {
        const x0 = wx, x1 = wx + 4.0;
        const z0 = wz, z1 = wz + 4.0;
        const h00 = -0.75 + Math.sin(x0 * 0.5 + sim.time * 3.0) * 0.18;
        const h10 = -0.75 + Math.sin(x1 * 0.5 + sim.time * 3.0) * 0.18;
        const h11 = -0.75 + Math.cos(z1 * 0.5 + sim.time * 2.5) * 0.18;
        const h01 = -0.75 + Math.cos(z0 * 0.5 + sim.time * 2.5) * 0.18;
        const shimmer = ((Math.floor(wx + wz + sim.time * 2) & 1) === 0);
        const col1 = shimmer ? [236, 132, 72] : [34, 132, 176];
        dynTris.push(makeTri([x0, h00, z0], [x0, h01, z1], [x1, h11, z1], col1, 0.2));
        dynTris.push(makeTri([x0, h00, z0], [x1, h11, z1], [x1, h10, z0], [28, 108, 152], 0.15));
      }
    }

    // Boiling Copper Paila Fire & Chontaduros
    const fireH = 0.36 + Math.sin(sim.time * 15) * 0.12;
    addSphereLowPoly(dynTris, -2.6, 0.35, 0.5, 0.42, fireH, 0.42, sim.time * 6, [252, 128, 24], 0.75);
    for (let c = 0; c < 4; c++) {
      const ang = sim.time * 2.5 + c * 1.57;
      addSphereLowPoly(
        dynTris,
        -2.6 + Math.cos(ang) * 0.28,
        1.34 + Math.sin(sim.time * 6 + c) * 0.04,
        0.5 + Math.sin(ang) * 0.28,
        0.15, 0.18, 0.15, ang,
        sim.pailaState === "READY" ? [252, 208, 38] : [232, 68, 32],
        0.4
      );
    }

    // Sculpted 3D Stock on Shelf & Counter (Chontaduros Ovoides & Botellas Torneadas de Viche con UV)
    for (let i = 0; i < Math.min(6, sim.shelfChonta); i++) {
      const cz = -0.75 + i * 0.45;
      addSculptedChontaduro3D(dynTris, 2.48, 1.12, cz, 0.38, sim.time * 1.5 + i, false);
    }
    for (let i = 0; i < Math.min(6, sim.shelfBottles); i++) {
      const bz = -0.75 + i * 0.45;
      addSculptedVicheBottle3D(dynTris, 2.68, 1.48, bz, 0.36, i * 0.8, (i & 1) === 1);
    }
    if (sim.shelfLegend > 0) {
      addSculptedChontaduro3D(
        dynTris,
        0.75, 1.42 + Math.sin(sim.time * 4) * 0.05, 2.62,
        0.54, sim.time * 2.5,
        true
      );
      addSculptedVicheBottle3D(dynTris, -0.75, 1.14, 2.62, 0.42, sim.time, false);
    }

    // Articulated 15-Part Meme Customers (Janfry, Jonyer, Dona Cruz, Tostao)
    sim.npcs.forEach((n, idx) => {
      const hop = n.state === "CELEBRATING" ? Math.abs(Math.sin(sim.time * 12)) * 0.35 : 0;
      addArticulatedHuman3D(
        dynTris,
        n.x, hop, n.z,
        Math.atan2(player.x - n.x, player.z - n.z),
        sim.time * 5.5 + idx * 1.7,
        0.92,
        [126, 76, 42],
        n.shirt,
        [30, 41, 59],
        n.hat,
        false,
        -1
      );
    });

    const camX = player.x;
    const camY = player.y + Math.sin(player.bobPhase) * 0.035;
    const camZ = player.z;
    const cosP = Math.cos(player.pitch);
    const sinP = Math.sin(player.pitch);

    function worldToCam(v) {
      const dx = v[0] - camX;
      const dy = v[1] - camY;
      const dz = v[2] - camZ;
      const rx = dx * cosY - dz * sinY;
      const rz = dx * sinY + dz * cosY;
      const cy = dy * cosP + rz * sinP;
      const cz = rz * cosP - dy * sinP;
      return [rx, cy, cz];
    }

    const renderQueue = [];
    function pushTri(c0, c1, c2, n, rgb, emit, zBias, tex, uv0, uv1, uv2) {
      if (c0[2] < 0.28 && c1[2] < 0.28 && c2[2] < 0.28) return;
      const z0 = Math.max(0.28, c0[2]);
      const z1 = Math.max(0.28, c1[2]);
      const z2 = Math.max(0.28, c2[2]);
      const zAvg = (z0 + z1 + z2) * 0.3333 + zBias;
      if (zAvg > 54) return;

      const sx0 = Math.round((W * 0.5 + (c0[0] / z0) * FOV) / SNAP_GRID) * SNAP_GRID;
      const sy0 = Math.round((H * 0.5 - (c0[1] / z0) * FOV) / SNAP_GRID) * SNAP_GRID;
      const sx1 = Math.round((W * 0.5 + (c1[0] / z1) * FOV) / SNAP_GRID) * SNAP_GRID;
      const sy1 = Math.round((H * 0.5 - (c1[1] / z1) * FOV) / SNAP_GRID) * SNAP_GRID;
      const sx2 = Math.round((W * 0.5 + (c2[0] / z2) * FOV) / SNAP_GRID) * SNAP_GRID;
      const sy2 = Math.round((H * 0.5 - (c2[1] / z2) * FOV) / SNAP_GRID) * SNAP_GRID;

      if ((sx0 < -120 && sx1 < -120 && sx2 < -120) || (sx0 > W + 120 && sx1 > W + 120 && sx2 > W + 120)) return;
      if ((sy0 < -120 && sy1 < -120 && sy2 < -120) || (sy0 > H + 120 && sy1 > H + 120 && sy2 > H + 120)) return;

      const dot = Math.max(0, n[0] * lightDir[0] + n[1] * lightDir[1] + n[2] * lightDir[2]);
      const intensity = Math.min(1.38, 0.44 + dot * 0.66 + emit);
      const fog = Math.max(0, Math.min(0.55, (zAvg - 26) / 32));
      const r = Math.min(255, Math.floor(rgb[0] * intensity * (1 - fog) + 232 * fog));
      const g = Math.min(255, Math.floor(rgb[1] * intensity * (1 - fog) + 122 * fog));
      const b = Math.min(255, Math.floor(rgb[2] * intensity * (1 - fog) + 74 * fog));
      const shadeAlpha = Math.max(0, Math.min(0.52, 1.04 - intensity));

      renderQueue.push({
        sx0: sx0, sy0: sy0, sx1: sx1, sy1: sy1, sx2: sx2, sy2: sy2,
        zAvg: zAvg,
        tex: (tex && zAvg < 58) ? tex : 'adoquin',
        uv0: uv0, uv1: uv1, uv2: uv2,
        shadeRgba: shadeAlpha > 0.04 ? ("rgba(28, 14, 10, " + shadeAlpha.toFixed(2) + ")") : null,
        fill: "rgb(" + r + "," + g + "," + b + ")",
        stroke: "rgb(" + Math.max(0, r - 14) + "," + Math.max(0, g - 14) + "," + Math.max(0, b - 14) + ")"
      });
    }

    const totalStatic = staticWorldTris.length;
    const totalDyn = dynTris.length;
    const totalWorld = totalStatic + totalDyn;
    for (let i = 0; i < totalWorld; i++) {
      const t = i < totalStatic ? staticWorldTris[i] : dynTris[i - totalStatic];
      pushTri(worldToCam(t.v0), worldToCam(t.v1), worldToCam(t.v2), t.n, t.rgb, t.emit, 0, t.tex, t.uv0, t.uv1, t.uv2);
    }

    // First-Person 3D Arms & Held 3D Object in Camera Space
    const camTris = [];
    const bobX = Math.cos(player.bobPhase * 0.5) * 0.05;
    const bobY = Math.abs(Math.sin(player.bobPhase)) * 0.04;
    addBox(camTris, -0.48 + bobX, -0.38 - bobY, 0.92, 0.16, 0.22, 0.65, [126, 76, 42], 0.08);
    addBox(camTris, -0.42 + bobX, -0.31 - bobY, 1.24, 0.18, 0.16, 0.18, [142, 88, 50], 0.1);
    addBox(camTris, 0.48 + bobX, -0.38 - bobY, 0.92, 0.16, 0.22, 0.65, [126, 76, 42], 0.08);
    addBox(camTris, 0.42 + bobX, -0.31 - bobY, 1.24, 0.18, 0.16, 0.18, [142, 88, 50], 0.1);

    if (player.holding) {
      const hx = bobX, hy = -0.26 - bobY, hz = 1.28;
      if (player.holding.type === "bulto") {
        addBox(camTris, hx, hy - 0.06, hz, 0.56, 0.28, 0.38, [176, 114, 56], 0.12, "madera");
        addSculptedChontaduro3D(camTris, hx - 0.16, hy + 0.22, hz, 0.28, sim.time * 2, false);
        addSculptedVicheBottle3D(camTris, hx + 0.16, hy + 0.04, hz, 0.28, -sim.time * 1.5, false);
      } else if (player.holding.type === "chonta_tray") {
        addBox(camTris, hx, hy - 0.06, hz, 0.62, 0.08, 0.36, [164, 98, 44], 0.1);
        for (let c = -1; c <= 1; c++) {
          addCylinder(camTris, hx + c * 0.18, hy - 0.02, hz, 0.06, 0.08, 0.22, 6, [232, 64, 34], 0.25);
          addSphereLowPoly(camTris, hx + c * 0.18, hy + 0.22, hz, 0.08, 0.08, 0.08, sim.time * 3, [252, 204, 24], 0.4);
        }
      } else if (player.holding.type === "bottle_crate") {
        addBox(camTris, hx, hy - 0.06, hz, 0.58, 0.14, 0.34, [124, 76, 36], 0.1);
        for (let b = -1; b <= 1; b++) {
          addCylinder(camTris, hx + b * 0.17, hy, hz, 0.065, 0.065, 0.24, 6, [42, 178, 98], 0.25);
          addCylinder(camTris, hx + b * 0.17, hy + 0.24, hz, 0.03, 0.03, 0.10, 6, [248, 224, 156], 0.35);
        }
      } else if (player.holding.type === "legend_chonta") {
        addSphereLowPoly(camTris, hx, hy + 0.06, hz, 0.22, 0.28, 0.22, sim.time * 4, [252, 224, 38], 0.68);
      }
    }

    for (let i = 0; i < camTris.length; i++) {
      const ct = camTris[i];
      pushTri(ct.v0, ct.v1, ct.v2, ct.n, ct.rgb, ct.emit, -10.0, ct.tex, ct.uv0, ct.uv1, ct.uv2);
    }

    renderQueue.sort((a, b) => b.zAvg - a.zAvg);
    for (let i = 0; i < renderQueue.length; i++) {
      const rq = renderQueue[i];
      const texImg = rq.tex ? texImages[rq.tex] : null;
      if (texImg && texImg.complete && texImg.naturalWidth > 0 && rq.uv0 && rq.uv1 && rq.uv2) {
        drawTexturedTriangleAffine(
          ctx, texImg,
          rq.sx0, rq.sy0, rq.sx1, rq.sy1, rq.sx2, rq.sy2,
          rq.uv0[0], rq.uv0[1], rq.uv1[0], rq.uv1[1], rq.uv2[0], rq.uv2[1],
          rq.shadeRgba
        );
      } else {
        ctx.beginPath();
        ctx.moveTo(rq.sx0, rq.sy0);
        ctx.lineTo(rq.sx1, rq.sy1);
        ctx.lineTo(rq.sx2, rq.sy2);
        ctx.closePath();
        ctx.fillStyle = rq.fill;
        ctx.fill();
        ctx.strokeStyle = rq.stroke;
        // Smooth sculpted edges without wireframe stroke
      }
    }

    // Floating Customer Order Bubbles with Real Product Photo Badges
    sim.npcs.forEach((n) => {
      const cv = worldToCam([n.x, 2.28, n.z]);
      if (cv[2] > 0.9 && cv[2] < 24) {
        const sx = W * 0.5 + (cv[0] / cv[2]) * FOV;
        const sy = H * 0.5 - (cv[1] / cv[2]) * FOV;
        ctx.font = "900 13px 'Chakra Petch', system-ui, sans-serif";
        ctx.textAlign = "center";
        ctx.strokeStyle = "#0F141C";
        ctx.lineWidth = 3.5;
        ctx.strokeText(n.name, sx, sy - 16);
        ctx.fillStyle = "#FFD166";
        ctx.fillText(n.name, sx, sy - 16);

        ctx.font = "700 11px 'JetBrains Mono', monospace";
        ctx.strokeText(n.want, sx, sy);
        ctx.fillStyle = "#6EE7B7";
        ctx.fillText(n.want, sx, sy);
        ctx.textAlign = "left";
      }
    });

    // =========================================================================
    // 2D HIGH-RESOLUTION MODERN INDIE UI LAYER (Schedule I / Dave the Diver style)
    // =========================================================================
    function drawCard(x, y, w, h, borderCol) {
      ctx.save();
      ctx.fillStyle = "rgba(15, 20, 28, 0.90)";
      ctx.strokeStyle = borderCol || "#D97706";
      ctx.lineWidth = 2;
      ctx.beginPath();
      if (ctx.roundRect) ctx.roundRect(x, y, w, h, 8);
      else ctx.rect(x, y, w, h);
      ctx.fill();
      ctx.stroke();
      ctx.restore();
    }

    // Center Crosshair
    ctx.strokeStyle = "#FFD166";
    ctx.lineWidth = 2;
    ctx.strokeRect(W * 0.5 - 5, H * 0.5 - 5, 10, 10);

    // 1. TOP-LEFT STATUS & INVENTORY CARD WITH REAL PHOTOS
    drawCard(14, 12, 420, 118, "#FFD166");
    const vicheImg = texImages["viche"];
    if (vicheImg && vicheImg.complete && vicheImg.naturalWidth > 0) {
      ctx.drawImage(vicheImg, 24, 24, 52, 52);
      ctx.strokeStyle = "#FFD166";
      ctx.lineWidth = 2;
      ctx.strokeRect(24, 24, 52, 52);
    }
    ctx.font = "900 16px 'Chakra Petch', 'Montserrat', system-ui, sans-serif";
    ctx.fillStyle = "#FFD166";
    ctx.fillText("MAESTRO VICHERO DEL MALECON 3D", 86, 38);
    ctx.font = "700 13px 'JetBrains Mono', monospace";
    ctx.fillStyle = "#6EE7B7";
    ctx.fillText("CAJA: $" + sim.money + " COP   |   REPUTACION: " + sim.rep + " PTS", 86, 58);
    ctx.font = "700 12px 'JetBrains Mono', monospace";
    ctx.fillStyle = "#FFF9EC";
    ctx.fillText(
      "ESTANTE: " + sim.shelfChonta + " CHONTADURO  |  " + sim.shelfBottles + " VICHE  |  " + sim.shelfLegend + " LEGEND x5",
      86,
      78
    );
    ctx.fillStyle = "#FDE047";
    ctx.fillText(
      "PAILA COBRE: " + (sim.pailaState === "READY" ? "LISTA [E]" : "HIRVIENDO...") +
      "  |  ALAMBIQUE: " + (sim.alambiqueState === "READY" ? "LISTO [E]" : "DESTILANDO..."),
      24,
      102
    );
    ctx.fillStyle = "#CBD5E1";
    ctx.font = "600 11px 'JetBrains Mono', monospace";
    ctx.fillText("UBICACION: MALECON DEL RIO ATRATO Y PLAZA CATEDRAL DE QUIBDO", 24, 120);

    // 2. TOP-RIGHT QUIBDO PLAZA & MALECON MINIMAP
    const mapS = 136;
    const mapX = W - mapS - 14;
    const mapY = 12;
    drawCard(mapX, mapY, mapS, mapS + 20, "#34D399");
    ctx.font = "800 12px 'Chakra Petch', system-ui, sans-serif";
    ctx.fillStyle = "#6EE7B7";
    ctx.textAlign = "center";
    ctx.fillText("RADAR MALECON QUIBDO", mapX + mapS * 0.5, mapY + 16);
    ctx.textAlign = "left";

    const mCx = mapX + mapS * 0.5;
    const mCy = mapY + mapS * 0.5 + 8;
    ctx.fillStyle = "#142029";
    ctx.fillRect(mapX + 8, mapY + 22, mapS - 16, mapS - 16);
    // Cathedral North
    ctx.fillStyle = "#FFD166";
    ctx.fillRect(mCx - 16, mapY + 25, 32, 8);
    // Stall Box
    ctx.strokeStyle = "#F59E0B";
    ctx.lineWidth = 1.5;
    ctx.strokeRect(mCx - 14, mCy - 10, 28, 18);
    // River South
    ctx.fillStyle = "#0284C7";
    ctx.fillRect(mapX + 8, mapY + mapS - 14, mapS - 16, 18);
    // NPCs
    sim.npcs.forEach((n) => {
      ctx.fillStyle = "#38BDF8";
      ctx.fillRect(mCx + n.x * 2.5 - 3, mCy - n.z * 2.2 - 3, 6, 6);
    });
    // Player
    ctx.fillStyle = "#FFFFFF";
    ctx.beginPath();
    ctx.arc(mCx + player.x * 2.5, mCy - player.z * 2.2, 4, 0, Math.PI * 2);
    ctx.fill();

    // 3. 3D PACK OPENING SHOWCASE BANNER WITH REAL PHOTOS
    if (sim.packRevealTimer > 0) {
      const pw = Math.min(680, W - 40);
      const px = Math.floor((W - pw) * 0.5);
      drawCard(px, 138, pw, 92, "#FFD166");
      ctx.font = "900 14px 'Chakra Petch', system-ui, sans-serif";
      ctx.fillStyle = "#FFD166";
      ctx.textAlign = "center";
      ctx.fillText("COSECHA DEL ATRATO ABIERTA! 5 PRODUCTOS OBTENIDOS:", W * 0.5, 158);
      ctx.textAlign = "left";
      const slotW = Math.floor((pw - 24) / 5);
      sim.packItems.forEach((it, idx) => {
        const ix = px + 12 + idx * slotW;
        const iy = 166;
        drawCard(ix, iy, slotW - 8, 56, it.isLegend ? "#FFD166" : "#38BDF8");
        const img = texImages[it.tex];
        if (img && img.complete && img.naturalWidth > 0) {
          ctx.drawImage(img, ix + 6, iy + 8, 36, 36);
        }
        ctx.font = "800 10px 'Chakra Petch', system-ui, sans-serif";
        ctx.fillStyle = it.isLegend ? "#FFD166" : "#FFF9EC";
        ctx.fillText(it.name.slice(0, 15), ix + 46, iy + 28);
      });
    }

    // 4. INTERACTION PROMPT & CUSTOMER DIALOGUE BAR
    const hovered = getHoveredTarget();
    const promptTxt = hovered
      ? hovered.label
      : player.holding
      ? "EN MANOS 3D: " + player.holding.label + " (MIRA AL ESTANTE O CLIENTE Y PULSA [E])"
      : "CAMINA CON WASD Y MIRA AL CLIENTE, PAILA, ALAMBIQUE O ESTANTE PARA INTERACTUAR [E]";

    const prW = Math.min(760, W - 32);
    const prX = Math.floor((W - prW) * 0.5);
    drawCard(prX, H - 112, prW, 34, "#34D399");
    ctx.font = "800 13px 'Chakra Petch', system-ui, sans-serif";
    ctx.fillStyle = "#6EE7B7";
    ctx.textAlign = "center";
    ctx.fillText(promptTxt, W * 0.5, H - 90);
    ctx.textAlign = "left";

    // 5. BOTTOM CATALOG & CONTROLS BAR WITH REAL TEXTURES
    const botW = Math.min(860, W - 24);
    const botX = Math.floor((W - botW) * 0.5);
    const botY = H - 72;
    drawCard(botX, botY, botW, 62, "#D97706");

    const catalog = [
      { tex: "chontaduro", name: "CHONTADURO MIEL", price: "$18 COP" },
      { tex: "viche", name: "VICHE / ARRECHON", price: "$28 COP" },
      { tex: "borojo", name: "BOROJO POWER", price: "$28 COP" },
      { tex: "popocho", name: "AMARILLO LEGEND", price: "$60 COP" }
    ];
    const cSlot = Math.floor((botW - 24) / 4);
    catalog.forEach((cat, i) => {
      const cx = botX + 12 + i * cSlot;
      const cy = botY + 7;
      const img = texImages[cat.tex];
      if (img && img.complete && img.naturalWidth > 0) {
        ctx.drawImage(img, cx, cy, 30, 30);
        ctx.strokeStyle = "#FFD166";
        ctx.lineWidth = 1.5;
        ctx.strokeRect(cx, cy, 30, 30);
      }
      ctx.font = "800 12px 'Chakra Petch', system-ui, sans-serif";
      ctx.fillStyle = "#FFD166";
      ctx.fillText(cat.name, cx + 38, cy + 13);
      ctx.font = "700 11px 'JetBrains Mono', monospace";
      ctx.fillStyle = "#FFF9EC";
      ctx.fillText(cat.price, cx + 38, cy + 27);
    });

    ctx.font = "700 11px 'JetBrains Mono', monospace";
    ctx.fillStyle = "#FDE047";
    ctx.textAlign = "center";
    ctx.fillText(sim.toast, W * 0.5, botY + 53);
    ctx.textAlign = "left";
  }

  return {
    player: player,
    sim: sim,
    keys: keys,
    drag: drag,
    stepFrame: stepFrame,
    handleInteract: handleInteract,
    trigger3DPackOpening: trigger3DPackOpening
  };
}

    const cvs = document.getElementById("gameCanvas");
    const game = createGame2Runtime(cvs, function() {
      return { w: window.innerWidth || 1280, h: window.innerHeight || 720 };
    });

    window.addEventListener("keydown", function(e) {
      game.keys[e.code] = true;
      if (e.code === "KeyE") game.handleInteract();
      if (e.code === "KeyF") game.trigger3DPackOpening();
      if (e.code === "Space") {
        e.preventDefault();
        if (game.player.holding && game.player.holding.type === "bulto") {
          game.trigger3DPackOpening();
        } else if (game.player.onGround) {
          game.player.vy = 5.8;
          game.player.onGround = false;
        }
      }
    });

    window.addEventListener("keyup", function(e) {
      game.keys[e.code] = false;
    });

    cvs.addEventListener("mousedown", function(e) {
      game.drag.active = true;
      game.drag.lastX = e.clientX;
      game.drag.lastY = e.clientY;
      if (e.button === 0) game.handleInteract();
    });

    window.addEventListener("mousemove", function(e) {
      if (!game.drag.active) return;
      const dx = e.clientX - game.drag.lastX;
      const dy = e.clientY - game.drag.lastY;
      game.drag.lastX = e.clientX;
      game.drag.lastY = e.clientY;
      game.player.yaw += dx * 0.006;
      game.player.pitch = Math.max(-0.68, Math.min(0.62, game.player.pitch - dy * 0.004));
    });

    window.addEventListener("mouseup", function() {
      game.drag.active = false;
    });

    let lastTs = performance.now();
    function loop(ts) {
      const dt = Math.min(0.05, (ts - lastTs) / 1000);
      lastTs = ts;
      game.stepFrame(dt);
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  })();
  </script>
</body>
